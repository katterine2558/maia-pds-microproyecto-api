# Levanta la solucion completa: modelo empaquetado dentro de la API, y el
# tablero encima. Es el artefacto de despliegue que pide la Entrega 3.
#
#     docker compose up --build
#     tablero -> http://localhost:8501
#     API     -> http://localhost:8000/docs
#
# El tablero vive en otro repositorio. Por defecto se construye desde GitHub,
# para no obligar a clonar los dos. Quien este trabajando en el tablero puede
# cambiar su `context` por la ruta local (ver el comentario mas abajo).

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: reingreso-api
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
    healthcheck:
      # El tablero no arranca hasta que el modelo este cargado: /health
      # responde 503 mientras el artefacto no este disponible.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  tablero:
    build:
      # Para trabajar contra una copia local del tablero, reemplazar por:
      #   context: ../maia-pds-microproyecto-ui
      context: https://github.com/katterine2558/maia-pds-microproyecto-ui.git#develop
    image: reingreso-ui
    ports:
      - "8501:8501"
    environment:
      # Dentro de la red de compose, la API se alcanza por el nombre del
      # servicio. No se usa localhost: ahi vive el contenedor del tablero.
      API_URL: http://api:8000
      PORT: 8501
    depends_on:
      api:
        condition: service_healthy

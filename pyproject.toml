[project]
name = "reingreso-diabetes"
version = "0.1.0"
description = "Prediccion de reingreso hospitalario a 30 dias en pacientes diabeticos"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    # Fijado al mismo mayor que el servidor de la EC2 (3.3.2).
    "mlflow>=3.3,<4",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
